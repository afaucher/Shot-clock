# Publishes the web app (index.html, style.css, js/, vendor/) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Then push to main, or run this workflow by hand from the
# Actions tab ("Run workflow").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp -r index.html style.css js img _site/
          mkdir -p _site/vendor && cp vendor/opencv-4.10.0.js _site/vendor/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
